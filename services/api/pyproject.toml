[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brasaland-api"
version = "0.1.0"
description = "Brasaland FastAPI service for incidents and supplier directory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pandas>=2.0",
  "tinydb>=4.8",
  "pydantic>=2.0",
  "email-validator>=2.0",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0,<4.1",
  "python-dotenv>=1.0",
  "pytest>=8.0",
  "sqlmodel>=0.0.39",
  "psycopg2-binary>=2.9.12",
  "prefect>=3",
  "celery>=5.6.3",
  "redis>=8.0.1",
  "flower>=2.0.1",
  "scikit-learn>=1.9.0",
  "scipy>=1.14.0",
  "matplotlib>=3.11.1",
  "jupyter>=1.1.1",
  "ipykernel>=7.3.0",
  "qdrant-client>=1.18.0",
  "openai>=2.49.0",
  "langgraph>=1.2.10",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "langchain-mcp-adapters>=0.3.1",
  "getmcpauth>=0.1.0",
  "mcp>=1.24,<2",
  "markitdown[pdf]>=0.1.7",
  "py-readability-metrics>=1.4.5",
]

[project.scripts]
seed = "seeds.suppliers:main"

[tool.pytest.ini_options]
pythonpath = ["../..", "."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["suppliers", "incident_analyzer", "auth", "users", "mailer", "inventory", "incidents", "telemetry", "reporting", "seeds", "job_runner", "task_dead_letters", "tasks", "knowledge", "agent", "rfp"]

[tool.hatch.build.targets.wheel.force-include]
"database.py" = "database.py"
"config.py" = "config.py"
"celery_app.py" = "celery_app.py"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]
