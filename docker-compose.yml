services:
  ui:
    build:
      context: ./uis
      dockerfile: Dockerfile
    command: ["sh", "/app/uis/start.sh"]
    env_file:
      - ./.env
    environment:
      BACKOFFICE_API_PROXY_TARGET: ${BACKOFFICE_API_PROXY_TARGET_DOCKER}
      INCIDENTS_API_PROXY_TARGET: ${INCIDENTS_API_PROXY_TARGET_DOCKER}
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/app/uis
      - ./src:/app/src
      - ui_website_node_modules:/app/uis/website/node_modules
      - ui_backoffice_node_modules:/app/uis/backoffice/node_modules
    depends_on:
      - backend
    networks:
      - brasaland-dev-net

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    # Override image CMD: keep API stable (no WatchFiles reload storms).
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen --no-dev && uv run uvicorn main:app --host 0.0.0.0 --port 8000",
      ]
    env_file:
      - ./.env
    environment:
      # Repo-root ``data/`` is mounted below; runner resolves pipelines via this.
      BRASALAND_REPO_ROOT: /workspace
      # Containers must use the Compose service hostname, not localhost.
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      # Keep container Python deps off the bind mount. Host `uv run` recreating
      # services/api/.venv otherwise deletes the interpreter under the running
      # API and the UI sees "socket hang up" on Run pipeline.
      - backend_api_venv:/app/.venv
      - ./packages:/app/packages
      - ./docs:/app/docs:ro
      - ./data:/workspace/data
    depends_on:
      - redis
      - qdrant
    networks:
      - brasaland-dev-net

  # DEV-55: Redis broker + Celery result backend (no eviction of queued messages).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    networks:
      - brasaland-dev-net
    restart: unless-stopped

  # DEV-55: independent Celery worker (not inside FastAPI / uvicorn).
  celery-worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen --no-dev && uv run celery -A celery_app worker --loglevel=info",
      ]
    env_file:
      - ./.env
    environment:
      BRASALAND_REPO_ROOT: /workspace
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/workspace
    volumes:
      - ./services/api:/app
      - backend_api_venv:/app/.venv
      - ./packages:/app/packages
      - ./docs:/app/docs:ro
      - ./data:/workspace/data
    depends_on:
      - redis
    networks:
      - brasaland-dev-net
    restart: unless-stopped

  # DEV-55: Flower queue monitor (dev).
  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen --no-dev && uv run celery -A celery_app flower --port=5555",
      ]
    env_file:
      - ./.env
    environment:
      BRASALAND_REPO_ROOT: /workspace
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    ports:
      - "5555:5555"
    volumes:
      - ./services/api:/app
      - backend_api_venv:/app/.venv
      - ./packages:/app/packages
    depends_on:
      - redis
    networks:
      - brasaland-dev-net
    restart: unless-stopped

  # DEV-53: independent nightly orchestrator (not inside FastAPI).
  # Equivalent cron: 0 2 * * * with TZ=America/Bogota → scripts/nightly_export.py
  nightly-worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen --no-dev && uv run python /workspace/scripts/nightly_scheduler.py",
      ]
    env_file:
      - ./.env
    environment:
      TZ: America/Bogota
      BRASALAND_REPO_ROOT: /workspace
      NIGHTLY_PIPELINE_CMD: uv run python /workspace/data/pipelines/pipeline.py
      PYTHONPATH: /app:/workspace
    volumes:
      - ./services/api:/app
      - backend_api_venv:/app/.venv
      - ./packages:/app/packages
      - ./data:/workspace/data
      - ./scripts:/workspace/scripts:ro
    depends_on:
      - backend
    networks:
      - brasaland-dev-net
    restart: unless-stopped

  # Milestone 7 / context-21: vector store for Brasaland knowledge RAG.
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - brasaland-dev-net
    restart: unless-stopped

networks:
  brasaland-dev-net:
    name: brasaland-dev-net

volumes:
  ui_website_node_modules:
  ui_backoffice_node_modules:
  backend_api_venv:
  qdrant_storage:
