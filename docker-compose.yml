services:
  ui:
    build:
      context: ./uis
      dockerfile: Dockerfile
    command: ["sh", "/app/uis/start.sh"]
    env_file:
      - ./.env
    environment:
      BACKOFFICE_API_PROXY_TARGET: ${BACKOFFICE_API_PROXY_TARGET_DOCKER}
      INCIDENTS_API_PROXY_TARGET: ${INCIDENTS_API_PROXY_TARGET_DOCKER}
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/app/uis
      - ./src:/app/src
      - ui_website_node_modules:/app/uis/website/node_modules
      - ui_backoffice_node_modules:/app/uis/backoffice/node_modules
    depends_on:
      - backend
    networks:
      - brasaland-dev-net

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    # Override image CMD: keep API stable (no WatchFiles reload storms).
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen --no-dev && uv run uvicorn main:app --host 0.0.0.0 --port 8000",
      ]
    env_file:
      - ./.env
    environment:
      # Repo-root ``data/`` is mounted below; runner resolves pipelines via this.
      BRASALAND_REPO_ROOT: /workspace
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      # Keep container Python deps off the bind mount. Host `uv run` recreating
      # services/api/.venv otherwise deletes the interpreter under the running
      # API and the UI sees "socket hang up" on Run pipeline.
      - backend_api_venv:/app/.venv
      - ./packages:/app/packages
      - ./docs:/app/docs:ro
      - ./data:/workspace/data
    networks:
      - brasaland-dev-net

networks:
  brasaland-dev-net:
    name: brasaland-dev-net

volumes:
  ui_website_node_modules:
  ui_backoffice_node_modules:
  backend_api_venv:
